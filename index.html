<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Apps</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="Apps">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png" type="image/png">
<style>
:root { --bg: #f2f2f7; --card: #ffffff; --ink: #1d1d1f; --ink-2: #6e6e73; --line: rgba(60, 60, 67, .12); --accent: #0071e3; --pill: #e8e8ed;
  --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 6px 20px rgba(0, 0, 0, .06); color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #000000; --card: #1c1c1e; --ink: #f5f5f7; --ink-2: #98989d; --line: rgba(84, 84, 88, .5); --accent: #2997ff; --pill: #2c2c2e;
    --shadow: none; color-scheme: dark; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 400 17px/1.47 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased; }
main { max-width: 680px; margin: 0 auto;
  padding: calc(40px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
h1 { margin: 0; font-size: 2.125rem; line-height: 1.12; font-weight: 700; letter-spacing: -.02em; }
.sub { margin: 8px 0 28px; color: var(--ink-2); }
ul { list-style: none; margin: 0; padding: 0; }
.apps { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
a.tile { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; height: 100%; padding: 18px 16px 16px;
  background: var(--card); border-radius: 18px; box-shadow: var(--shadow); color: inherit; text-decoration: none;
  -webkit-tap-highlight-color: transparent; transition: transform .15s ease; }
a.tile:active { transform: scale(.97); }
a.tile:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.icon { width: 64px; height: 64px; border-radius: 14px; margin-bottom: 10px; flex: none; display: block; background: var(--pill); }
.name { font-size: 1.125rem; font-weight: 650; line-height: 1.25; letter-spacing: -.01em; }
.desc { font-size: .9375rem; color: var(--ink-2); line-height: 1.35; }
.more { margin-top: 12px; }
a.tile.small { flex-direction: row; align-items: center; gap: 14px; padding: 14px 16px; }
a.tile.small .icon { width: 44px; height: 44px; border-radius: 10px; margin: 0; }
a.tile.small .text { display: flex; flex-direction: column; min-width: 0; flex: 1; }
a.tile.small .name { font-size: 1rem; }
.lock { display: inline-flex; align-items: center; gap: 5px; margin-top: 2px; font-size: .8125rem; color: var(--ink-2); }
.lock svg { width: 12px; height: 12px; }
.chev { width: 9px; height: 15px; color: var(--ink-2); flex: none; }
.how { margin: 28px 0 0; font-size: .875rem; color: var(--ink-2); }
@media (prefers-reduced-motion: reduce) { a.tile { transition: none; } a.tile:active { transform: none; } }
@media (max-width: 340px) { .apps { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>Apps</h1>
  <p class="sub">Two games and a coaching board.</p>
  <ul class="apps" aria-label="Games">
    <li><a class="tile" href="kickabout/"><img class="icon" src="kickabout/icon-180.png" alt="" width="64" height="64"><span class="name">Kickabout</span><span class="desc">Five-a-side football. Quick matches, a cup and a ranked ladder.</span></a></li>
    <li><a class="tile" href="beats/"><img class="icon" src="beats/icons/icon-180.png" alt="" width="64" height="64"><span class="name">Tigos Beats</span><span class="desc">Hit the notes in time, then make your own beats.</span></a></li>
  </ul>
  <ul class="more" aria-label="For coaches">
    <li><a class="tile small" href="drill-board/" aria-label="FootieBugs Drill Board, team passcode needed"><img class="icon" src="drill-board/icons/icon-180.png" alt="" width="44" height="44"><span class="text"><span class="name">FootieBugs Drill Board</span><span class="lock"><svg viewBox="0 0 12 12" aria-hidden="true"><path fill="currentColor" d="M3.5 5V3.6a2.5 2.5 0 0 1 5 0V5h.5c.6 0 1 .4 1 1v4.5c0 .6-.4 1-1 1H3c-.6 0-1-.4-1-1V6c0-.6.4-1 1-1zm1.3 0h2.4V3.6a1.2 1.2 0 0 0-2.4 0z"/></svg>Team passcode</span></span><svg class="chev" viewBox="0 0 9 15" aria-hidden="true"><path d="M1.5 1.5 7.5 7.5l-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a></li>
  </ul>
  <p class="how">On iPhone, open an app, tap Share, then Add to Home Screen.</p>
</main>
</body>
</html>
