<html lang="en">
<head>

<title>FootieBugs Drill Board</title>

<meta name="theme-color" content="#0b0f0c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Drill Board">

<style>
:root { --bg: #eef2ee; --card: #ffffff; --ink: #13211a; --ink-2: #4a5b51; --line: #b9c7bd; --brand: #146c43; --brand-ink: #ffffff;
  --mast: #146c43; --bug: #f2c500; --bug-ink: #1a1400; --danger: #c2332f; --focus: #0a58ca; color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #0d1511; --card: #142019; --ink: #e7efe9; --ink-2: #a8b9ae; --line: #33473a; --brand: #2fbf71; --brand-ink: #06130b;
    --mast: #10291b; --danger: #ff6b66; --focus: #7fb0ff; color-scheme: dark; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
  font: 400 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
.band { background: var(--mast); height: calc(132px + env(safe-area-inset-top)); }
main { display: flex; justify-content: center; padding: 0 max(16px, env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); margin-top: -84px; }
.card { width: 100%; max-width: 400px; background: var(--card); border-radius: 20px; padding: 28px 22px 24px;
  box-shadow: 0 1px 2px rgba(19, 33, 26, .08), 0 12px 32px rgba(19, 33, 26, .12); }
.logo { display: flex; justify-content: center; margin: -64px 0 10px; }
.logo span { display: grid; place-items: center; width: 76px; height: 76px; border-radius: 22px; background: var(--card); box-shadow: 0 4px 14px rgba(0, 0, 0, .14); }
.bug { width: 50px; height: 50px; }
.bug-shell { fill: var(--bug); stroke: var(--bug-ink); stroke-width: 1.2; }
.bug-split { stroke: var(--bug-ink); stroke-width: 1.4; }
.bug-dot, .bug-head { fill: var(--bug-ink); }
h1 { margin: 0; text-align: center; font-size: 1.45rem; line-height: 1.15; font-weight: 800; letter-spacing: -.01em; }
.lede { margin: 6px 0 22px; text-align: center; color: var(--ink-2); }
label.field { display: block; font-weight: 600; font-size: .94rem; margin-bottom: 6px; }
input[type="password"] { display: block; width: 100%; font: inherit; font-size: 17px; color: inherit; background: transparent;
  border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; min-height: 48px; -webkit-appearance: none; appearance: none; }
input[type="password"][aria-invalid="true"] { border-color: var(--danger); }
input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(20, 108, 67, .28); }
.check { display: flex; align-items: center; gap: 10px; margin: 16px 0 20px; min-height: 44px; cursor: pointer; }
.check input { width: 22px; height: 22px; margin: 0; accent-color: var(--brand); flex: none; }
.check input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; box-shadow: none; }
button { display: block; width: 100%; min-height: 50px; border: 0; border-radius: 12px; background: var(--brand); color: var(--brand-ink);
  font: inherit; font-weight: 700; font-size: 17px; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
button:disabled { opacity: .6; cursor: progress; }
.msg { min-height: 1.45em; margin: 14px 0 0; text-align: center; font-weight: 600; }
.msg.bad { color: var(--danger); }
.note { margin: 18px 0 0; text-align: center; font-size: .85rem; color: var(--ink-2); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<div class="band" aria-hidden="true"></div>
<main>
  <form class="card" id="gate" autocomplete="on">
    <div class="logo"><span><svg class="bug" viewBox="0 0 32 32" aria-hidden="true"><ellipse cx="16" cy="18" rx="10" ry="11" class="bug-shell"/><path d="M16 7 V29" class="bug-split"/><circle cx="11.5" cy="15" r="2.2" class="bug-dot"/><circle cx="20.5" cy="15" r="2.2" class="bug-dot"/><circle cx="12" cy="23" r="1.8" class="bug-dot"/><circle cx="20" cy="23" r="1.8" class="bug-dot"/><circle cx="16" cy="6.5" r="4" class="bug-head"/></svg></span></div>
    <h1>FootieBugs Drill Board</h1>
    <p class="lede" id="gate-lede">Enter the team passcode</p>
    <label class="field" for="passcode">Team passcode</label>
    <input id="passcode" name="password" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" required aria-describedby="gate-lede gate-msg">
    <label class="check"><input id="remember" type="checkbox" checked> Remember on this device</label>
    <button id="open" type="submit">Open</button>
    <p id="gate-msg" class="msg" role="status" aria-live="polite"></p>
    <noscript><p class="note">The Drill Board needs JavaScript.</p></noscript>
  </form>
</main>

<script>
(function () {
  'use strict';
  var KEY = 'drill-board-passcode ' + location.pathname.replace(/index\.html$/, '');
  var form = document.getElementById('gate');
  var input = document.getElementById('passcode');
  var remember = document.getElementById('remember');
  var button = document.getElementById('open');
  var msg = document.getElementById('gate-msg');
  var payload = document.getElementById('payload');
  var subtle = window.crypto && window.crypto.subtle;

  function store(fn) { try { return fn(window.localStorage); } catch (e) { return null; } }
  function bytes(b64) { var s = atob(b64), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
  function say(text, bad) { msg.textContent = text; msg.className = bad ? 'msg bad' : 'msg'; }
  function busy(on) { button.disabled = on; input.disabled = on; remember.disabled = on; form.setAttribute('aria-busy', on ? 'true' : 'false'); }

  function decrypt(passcode) {
    var salt = bytes(payload.getAttribute('data-salt'));
    var iv = bytes(payload.getAttribute('data-iv'));
    var iterations = Number(payload.getAttribute('data-iterations'));
    var secret = String(passcode).trim().normalize('NFC');
    return subtle.importKey('raw', new TextEncoder().encode(secret), 'PBKDF2', false, ['deriveKey']).then(function (base) {
      return subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: iterations, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    }).then(function (key) {
      return subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, bytes(payload.textContent.replace(/\s+/g, '')));
    }).then(function (plain) { return new TextDecoder().decode(plain); });
  }

  // The app replaces this page, so its own inline styles and script run as if it had loaded normally.
  function show(html) {
    document.open();
    document.write(html);
    document.close();
  }

  function unlock(passcode, saved) {
    busy(true);
    say('Opening\u2026');
    // let the message paint before the key derivation keeps the CPU busy for a moment
    setTimeout(function () {
      decrypt(passcode).then(function (html) {
        if (remember.checked) store(function (s) { s.setItem(KEY, passcode); });
        else store(function (s) { s.removeItem(KEY); });
        show(html);
      }, function () {
        busy(false);
        if (saved) {
          store(function (s) { s.removeItem(KEY); });
          say('The saved passcode no longer works. Enter the team passcode.', true);
        } else {
          input.setAttribute('aria-invalid', 'true');
          say("That passcode isn't right. Check it and try again.", true);
          input.select();
        }
        input.focus();
      });
    }, 30);
  }

  if (!subtle || !window.TextEncoder) {
    busy(true);
    say('This browser cannot open the Drill Board. Use an up-to-date Safari or Chrome over https.', true);
    return;
  }

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (!input.value.trim()) { input.setAttribute('aria-invalid', 'true'); say('Enter the team passcode first.', true); input.focus(); return; }
    unlock(input.value, false);
  });
  input.addEventListener('input', function () { input.removeAttribute('aria-invalid'); if (msg.className === 'msg bad') say('', false); });
  remember.addEventListener('change', function () { if (!remember.checked) store(function (s) { s.removeItem(KEY); }); });

  var saved = store(function (s) { return s.getItem(KEY); });
  if (saved) unlock(saved, true);
  else input.focus();
})();
</script>
